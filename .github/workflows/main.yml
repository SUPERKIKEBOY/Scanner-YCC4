
name: Build Etiqueta Scanner V4 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Android Project
        run: |
          echo "Searching Android project..."

          PROJECT_FILE=$(find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.git/*" \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android project not found"
            echo "Repository contents:"
            find . -maxdepth 8 -type f \
              -not -path "*/.git/*" | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "Project found: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Etiqueta-Scanner-V4
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
